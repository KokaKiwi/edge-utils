[workspace]
resolver = "3"
members = ["fastly/reactor", "fastly/reactor-macros", "fastly/demo-server"]
default-members = ["fastly/reactor", "fastly/reactor-macros"]

[workspace.package]
edition = "2024"
license = "LicenseRef-OQL-1.3"

[workspace.dependencies]
async-task = "4"
fastly = "0.11.13"
fastly-shared = "0.11.13"
fastly-sys = "0.11.13"
tracing = "0.1.44"

proc-macro2 = "1"
quote = "1"
syn = "2"

fastly-reactor = { path = "fastly/reactor" }
fastly-reactor-macros = { path = "fastly/reactor-macros" }
