[workspace]
resolver = "3"
members = [
    "fastly/async-macros",
    "fastly/async",
    "fastly/demo-server",
    "fastly/opentelemetry",
]
default-members = [
    "fastly/async-macros",
    "fastly/async",
    "fastly/opentelemetry",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-OQL-1.3"

[workspace.dependencies]
async-task = "4"
async-trait = "0.1.89"
bytes = "1.11.1"
fastly = "0.11.13"
fastly-shared = "0.11.13"
fastly-sys = "0.11.13"
futures = "0.3.32"
http = "1.4.0"
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
opentelemetry-http = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = "2"
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = "0.3.23"

fastly-async = { path = "fastly/async" }
fastly-async-macros = { path = "fastly/async-macros" }
fastly-opentelemetry = { path = "fastly/opentelemetry" }
